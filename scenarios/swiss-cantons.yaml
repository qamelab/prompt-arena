id: swiss-cantons-tax
title: Swiss cantonal tax burden
round: 1

# ─── Public parts (shown to students) ───
briefing: |
  You are a junior analyst at SwissStat. Your editor wants a chart for tomorrow's
  brief on cantonal tax burden trends.

task: |
  Identify the top 5 Swiss cantons by tax revenue per capita in 2023, then
  visualize how those cantons' per-capita ranking has shifted over the last 5 years.

dataset:
  filename: ch_cantons_tax.csv
  rows: 130
  schema_preview: |
    canton  year  population  tax_revenue
    ZH      2023   1559300    18943000
    BE      2023   1051600     9847000
    LU      2023    420326     3687000
    ZG      2023    130968     2641000
    ... (26 cantons × 5 years, 2019–2023)
  description: |
    Swiss cantonal tax data with columns canton (chr 2-letter code),
    year (int 2019-2023), population (int), tax_revenue (int CHF).
    26 cantons × 5 years = 130 rows.

# ─── Hidden parts (used by the judge, not shown in UI) ───
mechanical_checks:
  - key: computes_per_capita
    label: Computes per-capita correctly
    description: tax_revenue / population computed
  - key: filters_top5_2023
    label: Selects top 5 from 2023
    description: top-5 selection happens on 2023 data only
  - key: tracks_those5_over_time
    label: Tracks same 5 across years
    description: visualizes the SAME 5 cantons across 2019-2023 (not top-5-of-each-year)
  - key: uses_rank_or_per_capita_axis
    label: Right y-axis encoding
    description: y-axis encodes rank or per-capita value over time
  - key: has_labels_legend
    label: Axis labels & legend
    description: axis labels present AND legend distinguishes cantons
  - key: tidyverse_idiomatic
    label: Tidyverse idiomatic
    description: clean dplyr/ggplot2 usage, no base-R hacks or copy-paste loops
  - key: handles_data_correctly
    label: No data handling errors
    description: no division errors, wrong groupings, or wrong-year filters

holistic:
  audience: newspaper editor preparing tomorrow's brief
  voice: editor at a Swiss newspaper
  evaluation_lens:
    - Does the answer come across at a glance?
    - Is the chart honest (no misleading axis tricks, sensible scale)?
    - Is the prompt scoped well — neither under-specified nor over-specified?
    - Does the framing match the audience (newspaper editor, not academic paper)?
  anchors:
    "0-9": output is wrong, misleading, or unusable
    "10-19": technically present but a real editor would send it back for rework
    "20-26": good — would publish with minor edits
    "27-30": exceptional — sharp, clear, publication-ready as-is

