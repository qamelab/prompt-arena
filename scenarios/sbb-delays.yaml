id: sbb-delays
title: SBB delays — when, where, why
round: 2

# ─── Public parts (shown to students) ───
briefing: |
  You are an analyst at the Federal Office of Transport. The communications team
  is preparing a press briefing on intercity (IC) train delays in 2024 and wants
  a single chart that reads cleanly for journalists — they have two paragraphs
  of column space and want one figure that does most of the work. The press team
  is allergic to "weather is unpredictable, infrastructure is the real story" and
  also to "trains are late at rush hour" — they want both observations packed
  into the same picture.

task: |
  Identify the three delay causes that account for the most total delay minutes
  on intercity (IC) services in 2024. For those three causes, show how delay
  minutes are distributed across hours of the day, AND distinguish weekday from
  weekend incidents in the same chart.

  Use a consistent semantic colour per cause (one fixed colour each — no rainbow
  palette, no decorative recolouring), and avoid chart junk: no 3D, no dense
  decorative grid, no pie slices.

  Things to think about: "most total delay minutes" is a sum, not a count — a
  single 60-minute infrastructure failure outweighs ten 5-minute boarding delays,
  and using count would change the answer. The chart has three encodings to fit
  in one figure: cause (categorical, three levels), hour-of-day (continuous 0-23),
  and weekday vs. weekend (binary). Pick the geom and aesthetics so the encodings
  do not fight each other — typically that means cause goes on facets or the
  primary colour, and weekday vs. weekend takes a secondary aesthetic
  (linetype, fill, or split bars). The dataset has a station and a weather
  column that are extra context; you do not need them for this question.

dataset:
  filename: sbb_delays.csv
  rows: 1800
  schema_preview: |
    route             service_type  cause            start_time            station         delay_min  weather       year
    Zürich-Bern               IC    Infrastructure   2024-03-14 08:12:00   Bern               7        clear         2024
    Genève-Lausanne           IR    External         2024-07-22 17:48:00   Lausanne          12        rain          2024
    Basel-Olten               IC    Rolling stock    2024-11-05 07:31:00   Olten              4        clear         2024
    ... (1800 incidents across 2022-2024, six cause categories, weekday/weekend implicit in date)
  description: |
    SBB-style synthetic delay incidents. Columns: route (chr), service_type (chr,
    IC/IR/RE/S), cause (chr, one of Infrastructure / Rolling stock / External /
    Operations / Connection wait / Boarding), start_time (chr ISO 8601 timestamp),
    station (chr — primary station affected), delay_min (int), weather (chr —
    clear / rain / snow / fog), year (int 2022-2024). Weekday vs weekend can be
    derived from start_time. 1800 rows.

# ─── Hidden parts (used by the judge, not shown in UI) ───
mechanical_checks:
  - key: filters_ic_2024
    label: Filter to IC in 2024
    description: rows are filtered to service_type == "IC" AND year == 2024 before any aggregation
  - key: sums_delay_minutes
    label: Aggregates by sum of delay_min
    description: groups by cause and computes sum(delay_min) — not count of incidents, not mean
  - key: picks_top3_causes
    label: Picks the top 3 causes
    description: only the three causes with the largest 2024 IC total minutes are shown — not all six
  - key: extracts_hour_of_day
    label: Extracts hour-of-day
    description: hour is extracted from start_time (lubridate::hour or similar) and used as an x-axis variable
  - key: weekday_vs_weekend
    label: Weekday vs weekend distinguished
    description: weekday is derived from start_time and used to distinguish weekday from weekend incidents (color, linetype, facet, or split bars) — not just "weekday" as a variable that goes unused
  - key: semantic_color_per_cause
    label: Semantic colour per cause
    description: each cause is mapped to a single, consistent colour across the entire chart — no rainbow palette, no decorative recolouring, colour carries information (IBCS-style)
  - key: tidyverse_idiomatic
    label: Tidyverse idiomatic
    description: clean dplyr/ggplot2 with lubridate, no base-R hacks or copy-paste loops

holistic:
  audience: communications team preparing a press briefing
  voice: senior government data analyst writing a one-paragraph summary for journalists
  evaluation_lens:
    - Is the headline finding (which 3 causes, when in the day, weekday or weekend) easy to read off the chart?
    - Is the geom appropriate for the relationships (categorical cause × continuous hour × binary weekday)?
    - Does the colour use carry information rather than decoration (Tufte/IBCS)?
    - Is the prompt scoped well — neither under-specified nor over-specified for a one-shot Copilot generation?
  anchors:
    "0-9": output is wrong, misleading, or unusable for the briefing
    "10-19": technically present but the comms team would send it back for rework
    "20-26": good — would publish in the briefing pack with minor edits
    "27-30": exceptional — sharp, journalist-ready as-is

