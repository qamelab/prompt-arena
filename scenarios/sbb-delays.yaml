id: sbb-delays
title: SBB intercity delay causes
round: 2

# ─── Public parts (shown to students) ───
briefing: |
  You are an analyst at the Federal Office of Transport. The communications team
  is preparing a press briefing on intercity train delays in 2024.

task: |
  Identify the three delay causes that accounted for the most total minutes lost on
  intercity (IC) services in 2024, and show how each of those causes is distributed
  across the hours of the day.

dataset:
  filename: sbb_delays.csv
  rows: 720
  schema_preview: |
    route       service_type  cause              start_time            delay_min  year
    Zürich-Bern         IC    Infrastructure     2024-03-14 08:12:00          7    2024
    Genève-Lausanne     IR    External           2024-07-22 17:48:00         12    2024
    Basel-Olten         IC    Rolling stock      2024-11-05 07:31:00          4    2024
    ... (720 incidents across 2023-2024, six cause categories)
  description: |
    SBB-style synthetic delay incidents. Columns: route (chr), service_type (chr,
    one of IC/IR/RE/S), cause (chr, one of Infrastructure / Rolling stock /
    External / Operations / Connection wait / Boarding), start_time (chr ISO 8601
    timestamp), delay_min (int, minutes late), year (int 2023-2024). 720 rows.

# ─── Hidden parts (used by the judge, not shown in UI) ───
mechanical_checks:
  - key: filters_ic_2024
    label: Filter to IC services in 2024
    description: rows are filtered to service_type == "IC" AND year == 2024 before any aggregation
  - key: sums_delay_minutes
    label: Aggregates by sum of delay_min
    description: groups by cause and computes sum(delay_min) — not count of incidents
  - key: picks_top3_causes
    label: Picks the top 3 causes
    description: only the top 3 causes by total minutes are shown, not all of them
  - key: extracts_hour_of_day
    label: Extracts hour-of-day
    description: hour is extracted from start_time (lubridate::hour or similar) and used as an axis
  - key: distinguishes_causes
    label: Each cause distinguished
    description: the chart distinguishes the three causes (color, facet, or panel) so they are individually readable
  - key: has_labels_legend
    label: Axis labels & legend
    description: axis labels present AND a legend (or facet labels) makes the causes identifiable
  - key: tidyverse_idiomatic
    label: Tidyverse idiomatic
    description: clean dplyr/ggplot2 with lubridate, no base-R hacks or copy-paste loops

holistic:
  audience: communications team preparing a press briefing
  voice: senior government data analyst writing a one-paragraph summary for journalists
  evaluation_lens:
    - Is the headline finding (which 3 causes, when in the day) easy to read off the chart?
    - Does the visualisation choice fit the question (hour-of-day distribution, not just totals)?
    - Is the framing factual and cautious — no over-claiming about causation or trends?
    - Is the prompt scoped well — neither under-specified nor over-specified for a one-shot Copilot generation?
  anchors:
    "0-9": output is wrong, misleading, or unusable for the briefing
    "10-19": technically present but the comms team would send it back for rework
    "20-26": good — would publish in the briefing pack with minor edits
    "27-30": exceptional — sharp, journalist-ready as-is

